server:
  port: ${APP_PORT}

spring:
  application:
    name: fooddelivery-app-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

razorpay:
  key:
    id: ${RZP_KEY}
    secret: ${RZP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXP}

