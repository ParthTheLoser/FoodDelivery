server:
  port: ${APP_PORT}

spring:
  application:
    name: app-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: jdbc:mysql://localhost:3306/fda
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

razorpay:
  key:
    id: ${RZP_KEY}
    secret: ${RZP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXP}

